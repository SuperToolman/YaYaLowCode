[package]
name = "yaya-agent-v2-office"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
base64 = "0.22"
calamine = "=0.37.0"
rust_xlsxwriter = "=0.102.0"
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }
quick-xml = "=0.42.0"
pdf-extract = "=0.12.1"
csv = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
