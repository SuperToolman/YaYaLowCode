[workspace]
members = ["core", "worker", "office", "executor"]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
sea-orm = { version = "=2.0.0-rc.41", features = ["sqlx-postgres", "runtime-tokio-rustls", "with-json", "with-uuid", "with-chrono"] }

[patch.crates-io]
mime_guess = { path = "../api/vendor/mime_guess" }
