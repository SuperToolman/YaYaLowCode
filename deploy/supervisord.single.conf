[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:valkey]
command=/usr/local/bin/valkey-server --bind 127.0.0.1 --port 6379 --requirepass %(ENV_VALKEY_PASSWORD)s
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:api]
command=/usr/local/bin/yaya-api
user=yaya
environment=HOME="/home/yaya"
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=/usr/local/bin/node /app/web/node_modules/next/dist/bin/next start
directory=/app/web
user=yaya
environment=HOME="/home/yaya",PORT="8787"
autorestart=true
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:agent]
command=/usr/local/bin/node /app/agent/deepseek-harness/node_modules/tsx/dist/cli.mjs apps/yaya-host/src/bin.ts
directory=/app/agent/deepseek-harness
user=yaya
environment=HOME="/home/yaya",DSH_HOME="/var/lib/yaya/agent",DSH_PROFILE="web",DSH_HOST="127.0.0.1",DSH_PORT="8789",YAYA_PLATFORM_API_URL="http://127.0.0.1:8788"
autorestart=true
priority=25
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
