[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:valkey]
command=/usr/local/bin/valkey-server --bind 127.0.0.1 --port 6379 --requirepass %(ENV_VALKEY_PASSWORD)s
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:api]
command=/usr/local/bin/yaya-api
user=yaya
environment=HOME="/home/yaya"
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=/usr/local/bin/node /app/web/node_modules/next/dist/bin/next start
directory=/app/web
user=yaya
environment=HOME="/home/yaya",PORT="8787"
autorestart=true
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:agent-v2]
command=/usr/local/bin/yaya-agent-v2-worker
directory=/var/lib/yaya
user=yaya
environment=HOME="/home/yaya",YAYA_AGENT_V2_API_URL="http://127.0.0.1:8788",YAYA_AGENT_V2_CORDIS_HOST="/app/agent-v2/cordis-host/src/host.mjs"
autorestart=true
priority=25
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:agent-executor]
command=/usr/local/bin/yaya-agent-v2-executor
directory=/var/lib/yaya
user=yaya
environment=HOME="/home/yaya",YAYA_EXECUTION_BIND="127.0.0.1:8791",YAYA_EXECUTION_ROOT="/var/lib/yaya/executions"
autorestart=true
priority=22
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
